repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash
        args:
          - -c
          - |
            cd "$(git rev-parse --show-toplevel)" || exit 1
            [ "$#" -eq 0 ] && exit 0
            npx prettier --write "$@"
          - bash
        language: system
        files: ^(src/.*\.ts|testing/.*\.ts|oxlint\.config\.ts|rolldown\.config\.mjs|.*\.(json|md))$
        stages: [commit]
      - id: oxlint
        name: oxlint
        entry: bash
        args:
          - -c
          - |
            cd "$(git rev-parse --show-toplevel)" || exit 1
            [ "$#" -eq 0 ] && exit 0
            npx oxlint --tsconfig ./tsconfig.json --fix "$@"
          - bash
        language: system
        files: ^(src/.*\.ts|testing/.*\.ts)$
        stages: [commit]
      - id: tsc
        name: tsc
        entry: npm run type-check
        language: system
        files: ^(src|testing)/
        pass_filenames: false
        stages: [commit]
